services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: e2e-message-broker
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - e2e-network

  redis:
    image: redis:7-alpine
    container_name: e2e-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - e2e-network

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: e2e-pgvector
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=voice_rag
      - POSTGRES_USER=voice
      - POSTGRES_PASSWORD=voice
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./pgvector-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice_rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - e2e-network

  orchestrator:
    build: ../orchestrator-backend
    container_name: e2e-orchestrator
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - rabbitmq
    networks:
      - e2e-network

  asr-service:
    build: ../inference-services/asr_service
    container_name: e2e-asr-service
    gpus: all
    environment:
      - ASR_SHERPA_MODEL_DIR=/models/sherpa-onnx/sherpa-onnx-streaming-zipformer-en-2023-06-26
      - ASR_SHERPA_ENCODER=encoder-epoch-99-avg-1-chunk-16-left-128.onnx
      - ASR_SHERPA_DECODER=decoder-epoch-99-avg-1-chunk-16-left-128.onnx
      - ASR_SHERPA_JOINER=joiner-epoch-99-avg-1-chunk-16-left-128.onnx
      - ASR_SHERPA_TOKENS=tokens.txt
      - ASR_SHERPA_PROVIDER=cpu
      - ASR_SHERPA_NUM_THREADS=2
      - ASR_SHERPA_RULE1_MIN_TRAILING_SILENCE=2.4
      - ASR_SHERPA_RULE2_MIN_TRAILING_SILENCE=1.2
      - ASR_SHERPA_RULE3_MIN_UTTERANCE_LENGTH=20
      - ASR_SPEECH_RMS_THRESHOLD=0.012
      - ASR_SPEECH_START_FRAMES=3
      - ASR_PRE_ROLL_MS=250
      - ASR_TRAILING_SILENCE_MS=900
      - ASR_MIN_SPEECH_MS=450
      - ASR_MAX_UTTERANCE_SECONDS=20
      - ASR_WHISPER_MODEL=small.en
      - ASR_WHISPER_DEVICE=cuda
      - ASR_WHISPER_COMPUTE_TYPE=float16
      - ASR_TRANSCRIPT_REPLACEMENTS=L and M=LLM;L.N.=LLM;GUE=GUI;gooey=GUI;G U I=GUI;G P U=GPU
      - ASR_REJECT_FINAL_PATTERNS=^\s*(?:thanks for watching|thank you for watching|please subscribe|subscribe)\b;\bcommon terms\b;\bjupyter notebook\.?\s+common terms\b
      - HF_HOME=/models/huggingface
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    depends_on:
      - rabbitmq
    volumes:
      - model-cache:/models/huggingface
    networks:
      - e2e-network

  llm-service:
    build: ../inference-services/llm_service
    container_name: e2e-llm-service
    gpus: all
    environment:
      - HF_HOME=/models/huggingface
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LLM_HISTORY_TTL_SECONDS=86400
      - LLM_MAX_NEW_TOKENS=64
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    depends_on:
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - model-cache:/models
    networks:
      - e2e-network

  rag-service:
    build: ../inference-services/rag_service
    container_name: e2e-rag-service
    gpus: all
    environment:
      - HF_HOME=/models/huggingface
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - PGVECTOR_HOST=pgvector
      - PGVECTOR_PORT=5432
      - PGVECTOR_DB=voice_rag
      - PGVECTOR_USER=voice
      - PGVECTOR_PASSWORD=voice
      - RAG_EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - RAG_TOP_K=3
      - RAG_MIN_SIMILARITY=0.30
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    depends_on:
      rabbitmq:
        condition: service_started
      pgvector:
        condition: service_healthy
    volumes:
      - model-cache:/models
      - ./rag-docs:/data/rag-docs:ro
    networks:
      - e2e-network

  tts-service:
    build: ../inference-services/tts_service
    container_name: e2e-tts-service
    gpus: all
    environment:
      - HF_HOME=/models/huggingface
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - model-cache:/models
    depends_on:
      - rabbitmq
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge

volumes:
  model-cache:
  redis-data:
  pgvector-data:
