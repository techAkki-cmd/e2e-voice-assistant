services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: e2e-message-broker
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - e2e-network

  orchestrator:
    build: ../orchestrator-backend
    container_name: e2e-orchestrator
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - rabbitmq
    networks:
      - e2e-network

  asr-service:
    build: ../inference-services/asr_service
    container_name: e2e-asr-service
    depends_on:
      - rabbitmq
    networks:
      - e2e-network

  llm-service:
    build: ../inference-services/llm_service
    container_name: e2e-llm-service
    depends_on:
      - rabbitmq
    networks:
      - e2e-network

  tts-service:
    build: ../inference-services/tts_service
    container_name: e2e-tts-service
    depends_on:
      - rabbitmq
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge
