services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: e2e-message-broker
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - e2e-network

  orchestrator:
    build: ../orchestrator-backend
    container_name: e2e-orchestrator
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - rabbitmq
    networks:
      - e2e-network

  mock-inference:
    build: ../inference-services/base_mock
    container_name: e2e-mock-inference
    depends_on:
      - rabbitmq
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge
